[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gasmet"
version = "0.1.0"
description = "Prediccion de metalicidad gaseosa de galaxias a partir de imagenes de banda ancha de SDSS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Mitchell" },
    { name = "Ian Rivera" },
    { name = "Esteban Ibarra" },
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests no tocan la red ni los datos descargados: corren en segundos y
# sirven como chequeo en cada push.
addopts = "-ra --strict-markers"
