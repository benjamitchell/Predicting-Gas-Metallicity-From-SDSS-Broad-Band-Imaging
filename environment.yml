# Entorno para NLHPC (Leftraru) y cualquier cluster con GPU NVIDIA.
#
# Se usa conda y no "module load python" porque los modulos del cluster estan
# compilados por arquitectura (zen4 / legacy-skylake) y los nodos GPU son
# Skylake: cargar el modulo equivocado revienta con "Illegal instruction".
# Los paquetes de conda son binarios x86_64 portables.
#
#   conda env create -f environment.yml
#   conda activate gasmet
#   pip install -e .
name: gasmet
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - pyarrow>=14.0
  - astropy>=5.3
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - requests>=2.31
  - pillow>=10.0
  - pyyaml>=6.0
  - tqdm>=4.66
  - pip:
      # --index-url y NO --extra-index-url: el segundo es un indice ADICIONAL,
      # asi que pip igual puede sacar de PyPI y elige la version mas nueva de
      # ahi, que viene compilada con CUDA 13. Eso no sirve en este cluster por
      # dos motivos independientes:
      #
      #   1. el driver (570.x) soporta hasta CUDA 12.8, no 13;
      #   2. los builds cu130 ya no incluyen sm_70, que es la arquitectura de
      #      las Tesla V100. Su get_arch_list() parte en sm_75.
      #
      # cu121 si incluye sm_70 y calza con el driver.
      - --index-url https://download.pytorch.org/whl/cu121
      - torch
      - torchvision
